name: Create New Episode Scaffolding

# Scaffolds a new episode directory via scripts/create_episode.py, runs the full
# validation gate, and opens a PULL REQUEST with the result. It does NOT push to
# the default branch directly: the same `python tests/run_all.py` gate that every
# contributor PR must clear also gates this automation, and the human maintainer
# merges the PR (ADR-0012). This keeps `main` protected by a single, uniform rule.
#
# Hardening carried forward from the prior direct-push version:
#   - episode_number is regex-validated (exactly two digits) before any checkout;
#   - the validation suite runs BEFORE the branch is pushed / PR opened;
#   - GitHub Actions are pinned to immutable commit SHAs (version in the comment);
#   - commit message carries no emoji;
#   - concurrency guard serializes runs for the same episode number;
#   - empty-diff guard exits cleanly (no branch, no PR) when the scaffold is a no-op.

on:
  workflow_dispatch:
    inputs:
      episode_number:
        description: 'Episode Number (two digits, e.g., 01, 07, 10)'
        required: true
        type: string

# One scaffold run per episode number at a time; a re-run supersedes an in-flight one.
concurrency:
  group: create-episode-${{ inputs.episode_number }}
  cancel-in-progress: false

# contents: write  -> push the scaffold branch
# pull-requests: write -> open the PR via gh
permissions:
  contents: write
  pull-requests: write

jobs:
  create-episode:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Validate episode number
        run: |
          if ! echo "${{ inputs.episode_number }}" | grep -qE '^[0-9]{2}$'; then
            echo "::error::episode_number must be exactly two digits (e.g., 01, 07, 10). Got: '${{ inputs.episode_number }}'"
            exit 1
          fi

      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11.9'

      - name: Run Creation Script
        run: |
          python scripts/create_episode.py ${{ inputs.episode_number }}

      - name: Run validation gate
        run: |
          python tests/run_all.py

      - name: Detect changes (empty-diff guard)
        id: diff
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Scaffold produced no changes for EP${{ inputs.episode_number }} (already exists). No branch, no PR."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create branch, commit, and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          BRANCH="scaffold/ep${{ inputs.episode_number }}"
          git config --global user.name "Robotiko Automation"
          git config --global user.email "bot@robotiko.ai"
          git checkout -b "$BRANCH"
          git add episode-${{ inputs.episode_number }}/
          git commit -m "Scaffold EP${{ inputs.episode_number }}"
          # Scoped --force: this automation owns the scaffold/* namespace and a
          # re-run deliberately supersedes the previous scaffold branch.
          # (--force-with-lease cannot work here: the fresh CI checkout has no
          # remote-tracking ref for this branch, so it would refuse with
          # "stale info" on every re-run.) main is never pushed to (ADR-0012).
          git push --force origin "$BRANCH"

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="scaffold/ep${{ inputs.episode_number }}"
          BODY="$(cat <<'EOF'
          Automated episode scaffold generated by the "Create New Episode Scaffolding" workflow.

          - Generated by: scripts/create_episode.py
          - Validation gate: python tests/run_all.py ran green in this workflow BEFORE the branch was pushed (same single gate every contributor PR must clear).
          - Human step: review the scaffold and merge. main is not pushed to directly (ADR-0012).
          EOF
          )"
          # Reuse an existing open PR for this branch if the workflow was re-run.
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            echo "::notice::PR for $BRANCH already open; branch updated in place."
          else
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$BRANCH" \
              --title "Scaffold EP${{ inputs.episode_number }}" \
              --body "$BODY"
          fi
