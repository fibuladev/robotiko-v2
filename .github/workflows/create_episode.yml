name: Create New Episode Scaffolding

on:
  workflow_dispatch:
    inputs:
      episode_number:
        description: 'Episode Number (two digits, e.g., 01, 07, 10)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-episode:
    runs-on: ubuntu-latest
    steps:
      - name: Validate episode number
        run: |
          if ! echo "${{ inputs.episode_number }}" | grep -qE '^[0-9]{2}$'; then
            echo "::error::episode_number must be exactly two digits (e.g., 01, 07, 10). Got: '${{ inputs.episode_number }}'"
            exit 1
          fi

      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'

      - name: Run Creation Script
        run: |
          python scripts/create_episode.py ${{ inputs.episode_number }}

      - name: Run validation gate
        run: |
          python tests/run_all.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Robotiko Automation"
          git config --global user.email "bot@robotiko.ai"
          git add episode-${{ inputs.episode_number }}/
          git commit -m "Scaffold EP${{ inputs.episode_number }}"
          git push
