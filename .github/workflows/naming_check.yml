name: Naming & Pipeline Checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Naming convention check
        run: python tests/naming_check.py --full

      - name: Pipeline integrity check
        run: python tests/pipeline_integrity.py --full

      - name: Visual prompt validator
        run: python tests/visual_prompt_validator.py --full
