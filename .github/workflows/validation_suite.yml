name: Validation Suite

# One gate for the whole repo: all twelve check groups, from naming and pipeline
# integrity through the validator meta-tests (grade-the-graders) and the
# forbidden-terms gate. A red here blocks the merge. Everything runs through the
# single entrypoint `tests/run_all.py`.
#
# Dependencies are pinned for reproducibility and supply-chain safety:
#   - the project code is standard-library only (no `pip install`);
#   - the Python toolchain is pinned to an exact patch version;
#   - GitHub Actions are pinned to immutable commit SHAs (version in the comment).

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11.9'

      - name: Run the full validation suite (blocks on failure)
        run: |
          # tee to a file for the summary step; pipefail keeps a red suite red.
          set -o pipefail
          python tests/run_all.py | tee run_all_output.txt

      - name: Write check-group results to job summary
        if: always()
        run: |
          {
            echo "## Validation Suite - check groups"
            echo ""
            echo "| Result | Check group |"
            echo "| --- | --- |"
            if [ -f run_all_output.txt ]; then
              # Parse the SUMMARY block lines: "  [PASS] Naming convention".
              grep -E '^\s*\[(PASS|FAIL)\]' run_all_output.txt | while IFS= read -r line; do
                status="$(echo "$line" | grep -oE '\[(PASS|FAIL)\]' | tr -d '[]')"
                group="$(echo "$line" | sed -E 's/^\s*\[(PASS|FAIL)\]\s*//')"
                if [ "$status" = "PASS" ]; then icon="PASS"; else icon="FAIL"; fi
                echo "| $icon | $group |"
              done
              if ! grep -qE '^\s*\[(PASS|FAIL)\]' run_all_output.txt; then
                echo "| n/a | Suite produced no per-group results (see logs) |"
              fi
            else
              echo "| n/a | Suite output unavailable (run step did not start) |"
            fi
            echo ""
            echo "_Full log in the job's step output. This table is derived from \`tests/run_all.py\`._"
          } >> "$GITHUB_STEP_SUMMARY"
